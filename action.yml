name: 'Security Headers Checker'
description: 'HTTP güvenlik başlıklarını denetler, puanlar ve eşik altında işi başarısız kılar.'
author: 'Tarık Tozlu (@Tarikdxd)'
branding:
  icon: shield
  color: blue

inputs:
  url:
    description: 'Denetlenecek URL (https:// ile veya alan adı olarak)'
    required: true
  fail-under:
    description: 'Bu puanın altında iş başarısız olur (0-100)'
    required: false
    default: '70'
  format:
    description: 'Çıktı biçimi: text, json veya sarif'
    required: false
    default: 'text'

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest
    - shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        flags=()
        case "${{ inputs.format }}" in
          json) flags+=(--json) ;;
          sarif) flags+=(--sarif) ;;
        esac
        bun src/cli.ts "${{ inputs.url }}" --fail-under "${{ inputs.fail-under }}" "${flags[@]}"
